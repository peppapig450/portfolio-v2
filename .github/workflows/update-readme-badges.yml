name: Update README badges

on:
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Update README badges
        run: |
          ./ci/scripts/update_readme_badges.sh \
            --lockfile pnpm-lock.yaml \
            --readme README.md \
            --summary ${{ github.workspace }}/summary.txt

      - name: Create or update pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate_token.outputs.token }}
          branch: update/readme-badges
          commit-message: 'ci(readme): update badge versions'
          title: '[Automated] Update README badges'
          body-path: ${{ github.workspace }}/summary.txt
          add-paths: README.md
          labels: |
            dependencies
            automated
            auto-badges
          sign-commits: true

      - name: Show PR info
        if: steps.cpr.outputs.pull-request-number
        shell: bash
        run: |
          printf "## 🚀 Pull Request Created\n" >> "${GITHUB_STEP_SUMMARY}"

          printf -- "- **PR #%s**: [View Pull Request](%s)\n" \
            "${{ steps.cpr.outputs.pull-request-number }}" \
            "${{ steps.cpr.outputs.pull-request-url }}" >> "${GITHUB_STEP_SUMMARY}"

          printf -- "- **Operation**: %s\n" \
            "${{ steps.cpr.outputs.pull-request-operation }}" >> "${GITHUB_STEP_SUMMARY}"