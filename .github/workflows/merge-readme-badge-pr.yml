name: Merge badge PRs

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: merge-badges-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: |
      github.event.pull_request.user.login == 'badge-updater-bot[bot]' &&
      github.event.label.name == 'auto-badges'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Extract summary from PR body
        run: |
          mkdir -p commit-body
          printf '%s' "${{ github.event.pull_request.body }}" > commit-body/summary.txt

      - name: Merge badge PR using merge_if_badge_update.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ci/scripts/merge_if_badge_update.sh \
            --pr "${{ github.event.pull_request.number }}" \
            --summary "commit-body/summary.txt"
