name: Lint & Format

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'images/**'
      - '**.png'
      - '**.jpg'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          node-version-file: false
          require-lockfile: true
      - name: Run Prettier
        run: pnpm exec prettier --check .

      - name: Run ESLint
        run: pnpm run lint
